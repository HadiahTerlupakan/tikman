server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundle, so a cached copy pins the whole app
    # to an old deploy. nginx sends no Cache-Control of its own and browsers
    # then cache heuristically, which is how a deployed change goes unseen
    # until somebody thinks to hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything under /assets carries a content hash, so a given URL's bytes
    # never change and it can be kept for as long as the browser likes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A literal upstream name is resolved at config-parse time, so nginx died with
    # "host not found in upstream" whenever it booted before the api container.
    # Docker's embedded DNS plus a variable defers the lookup to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing here speaks WebSocket. /api/v1/cs/stream is Server-Sent
        # Events, which is an ordinary HTTP response that never ends — so the
        # upgrade dance this block used to carry sent "Connection: upgrade"
        # with an empty Upgrade header on every API request, because
        # $http_upgrade is always empty.
        #
        # Buffering off is what SSE actually needs: with it on, nginx holds the
        # events until its buffer flushes, so a message reaches the browser
        # late rather than when the API wrote it.
        proxy_buffering off;
        # Stated rather than inherited. The default is 60s, and the stream
        # survives it only because the handler beats every 15 — which makes the
        # stream's life depend on a number in a different file.
        proxy_read_timeout 1h;

        # The API accepts an attachment up to 16 MiB and says so when it
        # refuses one. nginx's own default is 1 MiB, and it refuses first, with
        # a 413 that names no size — so a photo from a phone would be turned
        # away before the API ever saw it. Keep this equal to maxUploadBytes.
        client_max_body_size 16m;
    }

    # /health sits outside /api, so without its own rule it falls through to the
    # SPA fallback and the dashboard receives index.html instead of JSON.
    location = /health {
        proxy_pass $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    # image/svg+xml is here for the chat wallpaper: 213 KB served raw, 85 KB
    # gzipped, and nginx compresses only what this list names.
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
