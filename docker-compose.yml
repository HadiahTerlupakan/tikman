version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: tikman-postgres
    volumes:
      # The migrations directory is deliberately not mounted into
      # /docker-entrypoint-initdb.d. Postgres runs every file there on first
      # init, including the .down.sql rollbacks, and one of those drops columns
      # from a table nothing has created yet — which aborts initialisation and
      # leaves a half-built data directory. The API applies these migrations at
      # startup instead, skipping rollback scripts and recording what it ran.
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tikman
      POSTGRES_USER: tikman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TIMESCALEDB_TELEMETRY: 'off'
    command: postgres -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tikman-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tikman-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tikman-network
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tikman-api
    ports:
      - "8080:8080"
      # Must match the listen port stored on the VPN page: WireGuard binds it
      # inside the container, and a mismatch means no site ever handshakes.
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=tikman
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=tikman
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - FIREBASE_SERVICE_ACCOUNT_JSON_B64=${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      - LOG_LEVEL=info
      - API_PORT=8080
    volumes:
      # Both processes write here: wa stores what customers send, api stores
      # what a CS uploads (CSHandler.storeUpload) before serving either back.
      - cs_media:/data/cs-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tikman-network
    restart: unless-stopped

  wa:
    build:
      context: ./backend
      dockerfile: Dockerfile.wa
    container_name: tikman-wa
    # container_name is what makes this the inverse of worker: Compose refuses
    # --scale on a service that has one, so this is the setting that keeps
    # two processes from ever sharing one WhatsApp session.
    #
    # Deliberately not network_mode: service:api. That namespace carries wg0,
    # and restarting api would take the WhatsApp session down with it — repeated
    # reconnects are exactly the pattern that gets an unofficial number flagged.
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=tikman
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=tikman
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - LOG_LEVEL=info
      - WA_MEDIA_DIR=/data/cs-media
      - WA_SEND_INTERVAL_MS=${WA_SEND_INTERVAL_MS:-1200}
      - WA_MEDIA_RETENTION_DAYS=${WA_MEDIA_RETENTION_DAYS:-90}
    volumes:
      - cs_media:/data/cs-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API owns the migrations; wa runs none. Starting wa first on a fresh
      # database means migration 41 has not run yet, so the unique index that
      # makes account seeding idempotent is not there to enforce it.
      api:
        condition: service_healthy
    networks:
      - tikman-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite inlines these at build time, so they are build args rather than
      # runtime environment. Unset means an empty Firebase config, which leaves
      # both features that rest on it — push notifications and the CS presence
      # panel — inert rather than half-configured.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL:-}
    container_name: tikman-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tikman-network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    # No container_name: Compose refuses --scale on a service that has one, and
    # running several workers is how this deployment adds polling capacity. Each
    # worker claims whole OLTs from the queue, so they share the chassis without
    # any configuration and without two of them reading one agent at once.
    #
    #   docker compose up -d --scale worker=3 worker
    #
    # Containers are then named src-worker-1, src-worker-2, and so on.
    network_mode: "service:api"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=tikman
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=tikman
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  trapd:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: tikman-trapd
    # Shares the API's network namespace so it hears traps arriving on the
    # WireGuard interface. UDP 162 is reached through the tunnel, not published
    # to the internet.
    network_mode: "service:api"
    entrypoint: ["./trapd"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=tikman
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=tikman
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped


networks:
  tikman-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  cs_media:
